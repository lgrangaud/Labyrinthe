<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labyrinthe</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#2a2118;--mut:#7a6c5a;--acc:#b5532a;--line:#dcd2c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1712;--card:#262019;--ink:#f1e8d8;--mut:#a89a85;--acc:#e08a5c;--line:#3a3227}}
:root[data-theme="dark"]{--bg:#1b1712;--card:#262019;--ink:#f1e8d8;--mut:#a89a85;--acc:#e08a5c;--line:#3a3227}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.niv{background:var(--acc);color:#fff;padding:4px 12px;border-radius:99px;font:600 .9rem system-ui,sans-serif}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:600 1.3rem system-ui,sans-serif;text-align:center;text-transform:uppercase;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:600 1rem system-ui,sans-serif;padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:6px 12px;font-size:.85rem}
#msg{min-height:1.4em;margin:8px 0 0;color:var(--mut);font:.9rem system-ui,sans-serif}
.img{font-size:4rem;text-align:center}
.img img{max-width:100%;border-radius:8px}
h2{margin:6px 0;font-size:1.2rem}
.lvl{background:var(--acc);color:#fff;border-radius:8px;padding:8px 12px;margin-top:10px;font:600 .95rem system-ui,sans-serif}
.hint{color:var(--mut);font-style:italic;margin:6px 0}
#inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;background:var(--bg);color:var(--ink);font:inherit}
.mini b{display:block;font-size:1.5rem}.mini small{color:var(--mut);font:.7rem system-ui,sans-serif}
h3{margin:0 0 8px;font-size:1rem}
</style>
</head>
<body>
<main>
<header><h1>🧭 Le Labyrinthe</h1><span class="niv" id="niv"></span></header>
<div class="box">
  <div class="row"><input id="code" placeholder="Code (ex. 7, S, !)" autocomplete="off" autocapitalize="characters"><button id="ok">Valider</button></div>
  <p id="msg"></p>
</div>
<div id="carte"></div>
<div class="box"><h3>🎒 Cartes trouvées (<span id="n">0</span>)</h3><div id="inv"></div></div>
<button class="sec" id="reset">Recommencer la partie</button>
</main>

const INDEX = {};
Object.keys(CARTES).forEach(k => { const c = norm(k.split(":")[1]); (INDEX[c] = INDEX[c]||[]).push(k); });
const lv = k => +k.split(":")[0], cd = k => k.split(":")[1];
let S = {niveau:1, case:null, trouvees:[], indices:{}, derniere:null};
try { const r = localStorage.getItem("labyrinthe2"); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
const save = () => { try { localStorage.setItem("labyrinthe2", JSON.stringify(S)); } catch(e){} };
const $ = id => document.getElementById(id);
const isImg = v => /^(data:|https?:)/.test(v||"");
const q = k => k.replace(/'/g,"\\'");

function renderCarte(k, nouveau){
  const c = CARTES[k]; if (!c) { $("carte").innerHTML = ""; return; }
  const nb = S.indices[k] || 0, total = c.indices.length;
  let h = '<div class="box"><div class="img">'+(isImg(c.img)?'<img src="'+c.img+'" alt="">':c.img)+'</div><h2>'+c.titre+'</h2><div>'+c.texte+'</div>';
  if (c.niveau && nouveau) h += '<div class="lvl">➡️ Rendez-vous au niveau '+c.niveau+', case '+c.case+'</div>';
  for (let i=0;i<nb;i++) h += '<p class="hint">💡 '+c.indices[i]+'</p>';
  if (nb < total) h += '<p><button class="sec" onclick="indice(\''+q(k)+'\')">💡 Indice ('+nb+'/'+total+')</button></p>';
  $("carte").innerHTML = h + '</div>';
}
function renderInv(){
  $("n").textContent = S.trouvees.length;
  $("inv").innerHTML = S.trouvees.map(k => '<button class="mini" onclick="voir(\''+q(k)+'\')"><b>'+(isImg(CARTES[k].img)?"🖼️":CARTES[k].img)+'</b>'+cd(k)+'<br><small>Niv. '+lv(k)+'</small></button>').join("") || '<span style="color:var(--mut)">Aucune carte pour l\'instant.</span>';
  $("niv").textContent = "Niveau " + S.niveau + (S.case ? " · case "+S.case : "");
}
function valider(){
  const saisie = norm($("code").value); $("code").value = "";
  if (!saisie) return;
  const l = INDEX[saisie];
  if (!l) { $("msg").textContent = "❌ Ce code ne correspond à rien."; return; }
  let k = l.find(x => lv(x) === S.niveau);
  if (!k) { if (l.length > 1) { $("msg").textContent = "❌ Aucune case « "+saisie+" » au niveau "+S.niveau+"."; return; } k = l[0]; }
  const nouveau = !S.trouvees.includes(k), c = CARTES[k];
  S.niveau = lv(k); S.case = null;
  if (nouveau) { S.trouvees.push(k); $("msg").textContent = "✅ Nouvelle carte découverte !"; } else $("msg").textContent = "ℹ️ Carte déjà trouvée.";
  if (c.niveau) { S.niveau = c.niveau; S.case = c.case; }
  S.derniere = k; save(); renderCarte(k, true); renderInv();
}
function indice(k){ S.indices[k] = (S.indices[k]||0)+1; save(); renderCarte(k,false); }
function voir(k){ S.derniere = k; renderCarte(k,false); window.scrollTo({top:0,behavior:"smooth"}); }
$("ok").onclick = valider;
$("code").addEventListener("keydown", e => { if (e.key==="Enter") valider(); });
$("reset").onclick = () => { if (confirm("Effacer toute la progression ?")) { S = {niveau:1,case:null,trouvees:[],indices:{},derniere:null}; save(); $("carte").innerHTML=""; $("msg").textContent=""; renderInv(); } };
renderInv(); if (S.derniere) renderCarte(S.derniere,false);
</script>
</body>
</html>
